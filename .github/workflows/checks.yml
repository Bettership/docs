name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test the lint script
        run: npm test

      - name: Lint the pages
        run: node scripts/lint.mjs

      # mint is pinned in package.json because its newest release can need parts npm does not have yet. Bump it on purpose.
      - name: Validate the site
        run: npx --no-install mint validate

      - name: Check for broken links
        run: npx --no-install mint broken-links
